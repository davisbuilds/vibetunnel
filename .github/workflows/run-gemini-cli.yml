name: Run Gemini CLI

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  run-gemini:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Gemini CLI
        uses: google-github-actions/run-gemini-cli@9dbec29a20fab3f35017a40ad0eb798a257d4d51 # v0.1.21
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          # Optional: Specify custom prompt or configuration
          # prompt: "Review this code for improvements"
